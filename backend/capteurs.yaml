# Registre des capteurs de Botanik.
#
# Source unique de verite : le backend le lit pour publier, l'API l'expose,
# et le dashboard s'y adapte. Ajouter un capteur ici le fait apparaitre a
# l'ecran sans toucher au front.
#
# Chaque capteur declare DEUX facons d'etre lu :
#   reel   : le materiel, quand il est branche
#   simule : des valeurs plausibles, en attendant
# La variable d'environnement MODE (faux|reel) choisit laquelle s'applique.

capteurs:
  - id: temperature_air
    libelle: Température
    unite: "°C"
    actif: true
    ideal: {min: 18, max: 24}      # plage favorable a la germination
    echelle: {min: 10, max: 35}    # bornes de la jauge affichee
    reel:
      # LM35 sur la voie 0 du convertisseur. 10 mV par degre : la
      # conversion est une equivalence physique, rien a etalonner.
      driver: mcp3004
      canal: 0
      conversion: lm35
    simule: {profil: cycle_jour, base: 21, amplitude: 3, bruit: 0.2}

  - id: humidite_sol_a
    libelle: Humidité du sol
    unite: "%"
    actif: true
    ideal: {min: 50, max: 70}
    echelle: {min: 0, max: 100}
    reel:
      # Sonde d'humidite sur la voie 2. Elle parcourt toute l'echelle du
      # convertisseur -- 0 a sec, 1 saturee -- et l'echelle affichee va
      # de 0 a 100 % : la conversion se reduit donc a un facteur cent.
      driver: mcp3004
      canal: 2
      conversion: lineaire
      etalonnage: {brut_bas: 0.0, brut_haut: 1.0}
    simule: {profil: decroissant, depart: 62, vitesse: 0.05, plancher: 12, bruit: 0.3}

  - id: luminosite
    libelle: Luminosité
    unite: lux
    actif: true
    ideal: {min: 4000, max: 10000}
    echelle: {min: 0, max: 12000}
    # Cablee et lue, mais gardee en simulation le temps de valider
    # la temperature seule. Retirer cette ligne pour la brancher.
    simuler: true
    reel:
      # Photoresistance sur la voie 1. Une LDR ne mesure pas des lux :
      # elle dit « plus clair » ou « moins clair ». L'echelle 0-12000
      # est donc une convention d'affichage, retenue pour rester
      # coherente avec ce sur quoi le reseau a ete entraine.
      # A etalonner au luxmetre si l'occasion se presente.
      driver: mcp3004
      canal: 1
      conversion: lineaire
      etalonnage: {brut_bas: 0.0, brut_haut: 1.0}
    simule: {profil: lumiere, maximum: 7000, bruit: 150}

  - id: niveau_eau
    libelle: Niveau d'eau
    unite: "%"
    actif: true
    ideal: {min: 20, max: 100}     # sous 20 %, il faut remplir la reserve
    echelle: {min: 0, max: 100}
    reel:
      # Sonde de niveau sur la voie 3. Contrairement aux autres, elle ne
      # parcourt que la MOITIE de l'echelle du convertisseur : reservoir
      # plein, elle plafonne autour de 0.5. D'ou la borne haute, qui
      # revient a doubler la valeur brute.
      driver: mcp3004
      canal: 3
      conversion: lineaire
      etalonnage: {brut_bas: 0.0, brut_haut: 0.5}
    simule: {profil: decroissant, depart: 85, vitesse: 0.02, plancher: 0, bruit: 0.1}

  # ---- non achetes pour l'instant : declares mais inactifs ----

  - id: humidite_sol_b
    libelle: Humidité du sol (2)
    unite: "%"
    actif: false
    ideal: {min: 50, max: 70}
    echelle: {min: 0, max: 100}
    reel:
      driver: ads1115
      adresse: 0x48
      canal: 1
      calibration: {sec_v: 3.0, mouille_v: 1.5}
    simule: {profil: decroissant, depart: 60, vitesse: 0.05, plancher: 12, bruit: 0.3}

  - id: humidite_air
    libelle: Humidité de l'air
    unite: "%"
    actif: false
    ideal: {min: 50, max: 70}
    echelle: {min: 0, max: 100}
    reel:
      driver: bme280
      adresse: 0x76
      grandeur: humidite
    simule: {profil: cycle_jour, base: 55, amplitude: -8, bruit: 1.0}

  - id: temperature_sol
    libelle: Température du sol
    unite: "°C"
    actif: false
    ideal: {min: 15, max: 22}
    echelle: {min: 10, max: 35}
    reel:
      driver: ds18b20
      identifiant: "28-000000000000"
    simule: {profil: cycle_jour, base: 20, amplitude: 2, bruit: 0.1}
