# Registre des capteurs de Botanik.
#
# Source unique de verite : le backend le lit pour publier, l'API l'expose,
# et le dashboard s'y adapte. Ajouter un capteur ici le fait apparaitre a
# l'ecran sans toucher au front.
#
# Chaque capteur declare DEUX facons d'etre lu :
#   reel   : le materiel, quand il est branche
#   simule : des valeurs plausibles, en attendant
# La variable d'environnement MODE (faux|reel) choisit laquelle s'applique.

capteurs:
  - id: temperature_air
    libelle: Température
    unite: "°C"
    actif: true
    ideal: {min: 18, max: 24}      # plage favorable a la germination
    echelle: {min: 10, max: 35}    # bornes de la jauge affichee
    reel:
      # DS18B20 sur le bus 1-Wire, en remplacement du LM35 analogique
      # qui ne repondait plus. Sonde numerique : elle rend des degres,
      # pas une tension a convertir, et sa trame porte un CRC.
      #
      # L'identifiant est grave dans la sonde : en changer une impose de
      # relever le nouveau dans /sys/bus/w1/devices.
      driver: ds18b20
      identifiant: 28-0b23448831d9
    simule: {profil: cycle_jour, base: 21, amplitude: 3, bruit: 0.2}

  - id: humidite_sol_a
    libelle: Humidité du sol
    unite: "%"
    actif: true
    ideal: {min: 50, max: 70}
    echelle: {min: 0, max: 100}
    reel:
      # Sonde d'humidite sur la voie 2. Elle parcourt toute l'echelle du
      # convertisseur -- 0 a sec, 1 saturee -- et l'echelle affichee va
      # de 0 a 100 % : la conversion se reduit donc a un facteur cent.
      driver: mcp3004
      canal: 2
      conversion: lineaire
      etalonnage: {brut_bas: 0.0, brut_haut: 1.0}
    simule: {profil: decroissant, depart: 62, vitesse: 0.05, plancher: 12, bruit: 0.3}

  - id: luminosite
    libelle: Luminosité
    # Pourcentage et non lux : une photoresistance ne mesure pas un
    # eclairement absolu, elle dit « plus clair » ou « moins clair ».
    # Afficher des lux aurait ete une precision inventee.
    unite: "%"
    actif: true
    ideal: {min: 33, max: 83}
    echelle: {min: 0, max: 100}
    reel:
      # Photoresistance sur la voie 1, pleine echelle du convertisseur.
      driver: mcp3004
      canal: 1
      conversion: lineaire
      etalonnage: {brut_bas: 0.0, brut_haut: 1.0}
    simule: {profil: lumiere, maximum: 58, bruit: 1.2}

  - id: niveau_eau
    libelle: Niveau d'eau
    unite: "%"
    actif: true
    ideal: {min: 20, max: 100}     # sous 20 %, il faut remplir la reserve
    echelle: {min: 0, max: 100}
    reel:
      # Telemetre a ultrasons au-dessus du reservoir, en remplacement de
      # la sonde resistive qui plafonnait a mi-echelle.
      #
      # ETALONNAGE PROVISOIRE, pose au juge : `plein_cm` est la distance
      # entre le capteur et le liquide quand le reservoir est plein,
      # `vide_cm` celle qui le separe du fond. Les deux dependent de la
      # hauteur a laquelle le capteur est visse, donc du montage et de
      # rien d'autre.
      #
      # A refaire en deux mesures : relever la distance reservoir plein,
      # puis reservoir vide, et reporter les chiffres ici. Tant que ce
      # n'est pas fait, le pourcentage est une tendance, pas un niveau.
      driver: hcsr04
      trigger: 17
      echo: 27
      portee_m: 1.0
      etalonnage: {plein_cm: 5, vide_cm: 25}
    simule: {profil: decroissant, depart: 85, vitesse: 0.02, plancher: 0, bruit: 0.1}

  # ---- non achetes pour l'instant : declares mais inactifs ----

  - id: humidite_sol_b
    libelle: Humidité du sol (2)
    unite: "%"
    actif: false
    ideal: {min: 50, max: 70}
    echelle: {min: 0, max: 100}
    reel:
      driver: ads1115
      adresse: 0x48
      canal: 1
      calibration: {sec_v: 3.0, mouille_v: 1.5}
    simule: {profil: decroissant, depart: 60, vitesse: 0.05, plancher: 12, bruit: 0.3}

  - id: humidite_air
    libelle: Humidité de l'air
    unite: "%"
    actif: false
    ideal: {min: 50, max: 70}
    echelle: {min: 0, max: 100}
    reel:
      driver: bme280
      adresse: 0x76
      grandeur: humidite
    simule: {profil: cycle_jour, base: 55, amplitude: -8, bruit: 1.0}

  - id: temperature_sol
    libelle: Température du sol
    unite: "°C"
    actif: false
    ideal: {min: 15, max: 22}
    echelle: {min: 10, max: 35}
    reel:
      driver: ds18b20
      identifiant: "28-000000000000"
    simule: {profil: cycle_jour, base: 20, amplitude: 2, bruit: 0.1}
