# Registre des capteurs de Botanik.
#
# Chaque capteur declare DEUX facons d'etre lu :
#   reel   : le materiel, quand il est branche
#   simule : des valeurs plausibles, en attendant
# La variable d'environnement MODE (faux|reel) choisit laquelle s'applique.
#
# Brancher un capteur = renseigner son bloc "reel" et passer "actif" a true.
# Aucun code a modifier.

capteurs:
  - id: humidite_sol_a
    unite: "%"
    actif: true
    reel:
      driver: ads1115          # analogique : passe par un convertisseur
      adresse: 0x48
      canal: 0
      calibration: {sec_v: 3.0, mouille_v: 1.5}
    simule:
      profil: decroissant
      depart: 55
      vitesse: 0.05
      plancher: 12
      bruit: 0.3

  - id: humidite_sol_b
    unite: "%"
    actif: true
    reel:
      driver: ads1115
      adresse: 0x48
      canal: 1
      calibration: {sec_v: 3.0, mouille_v: 1.5}
    simule:
      profil: decroissant
      depart: 53
      vitesse: 0.05
      plancher: 12
      bruit: 0.3

  - id: temperature_air
    unite: degC
    actif: true
    reel:
      driver: bme280           # numerique I2C : valeur deja convertie
      adresse: 0x76
      grandeur: temperature
    simule:
      profil: cycle_jour
      base: 21
      amplitude: 3
      bruit: 0.2

  - id: humidite_air
    unite: "%"
    actif: true
    reel:
      driver: bme280
      adresse: 0x76
      grandeur: humidite
    simule:
      profil: cycle_jour
      base: 55
      amplitude: -8           # plus sec quand il fait chaud
      bruit: 1.0

  - id: temperature_sol
    unite: degC
    actif: true
    reel:
      driver: ds18b20          # numerique 1-Wire
      identifiant: "28-000000000000"
    simule:
      profil: cycle_jour
      base: 20
      amplitude: 2
      bruit: 0.1

  - id: luminosite
    unite: lux
    actif: true
    reel:
      driver: bh1750
      adresse: 0x23
    simule:
      profil: lumiere
      maximum: 7000
      bruit: 150
