# Registre des actionneurs de Botanik.
#
# Meme principe que capteurs.yaml : source unique de verite. Le service
# actionneurs.py y prend ce qu'il doit piloter, l'API ce qu'elle doit
# exposer, et le dashboard s'y adapte sans qu'on le touche.
#
# Chaque actionneur declare DEUX facons d'etre actionne :
#   reel   : la broche GPIO, quand le relais sera cable
#   simule : rien a piloter, l'ordre est simplement accepte
# La variable d'environnement MODE (faux|reel) choisit laquelle s'applique.
#
# Il n'y a plus de distinction entre actionneurs « du modele » et
# actionneurs « manuels » : tout ce qui est actif peut etre commande a la
# main, et tout peut etre designe par une regle. C'est l'utilisateur qui
# choisit, regle par regle, depuis la page des reglages.
#
# Les numeros de broche sont en numerotation BCM.
#
# Les broches des elements inactifs sont PROVISOIRES : elles ne
# designent que des GPIO libres, pour qu'activer un element ne le fasse
# pas entrer en conflit avec un autre. A confirmer au cablage.
#
# `actif: false` retire un element de TOUTE la chaine : il ne parait plus
# a l'ecran, le cerveau ne lui envoie plus d'ordre, et le service ne le
# pilote pas. C'est le cas de la ventilation, commandee mais pas encore
# livree -- la declarer sans l'avoir donnerait un tableau de bord qui
# promet une action impossible. La remettre a `true` le jour de la
# livraison suffira.

actionneurs:
  - id: pompe
    libelle: Arrosage
    detail: 21 mL par impulsion
    actif: true
    # Par impulsions, et pas autrement. Une pompe qui tourne tant que le
    # sol est sec noierait le pot bien avant que la sonde ne change
    # d'avis : l'eau met des minutes a gagner la terre autour d'elle,
    # l'ordre serait maintenu tout ce temps. Un coup, puis l'attente que
    # la mesure veuille bien reagir.
    #
    # La cadence vient du debit, 100 L/h, soit 27,8 mL/s :
    #
    #   0,75 s  ->  20,8 mL par impulsion
    #   60 s    ->  21 mL par minute au plus, tant que le sol reste sec
    #
    # 0,75 et non 0,7 : le cerveau bat au quart de seconde, une duree
    # qui n'en est pas un multiple serait arrondie au tour suivant sans
    # qu'on sache laquelle s'applique.
    salve: {actif_s: 0.75, repos_s: 60}
    # Relais sur GPIO 26 (actif a l'etat haut), conforme au montage.
    reel: {driver: gpio, broche: 26}
    simule: {}

  - id: ventilation
    libelle: Ventilation
    detail: Assèche l'air ambiant
    actif: false
    reel: {driver: gpio, broche: 13}
    simule: {}

  - id: lumiere
    libelle: Éclairage
    detail: LED horticole, budget quotidien
    actif: true
    # Aucune salve ici, contrairement a la pompe : une lampe horticole
    # est faite pour rester allumee, et c'est le budget quotidien qui
    # borne son usage, pas une cadence.
    #
    # Relais sur GPIO 19 (actif a l'etat haut). Le code de test porte un
    # commentaire qui annonce le GPIO 22 : c'est le commentaire qui a
    # tort, il ouvre bien le 19 -- et le 22 est deja la LED verte, que
    # le controle de cablage aurait refuse de partager.
    reel: {driver: gpio, broche: 19}
    simule: {}

  - id: bipeur
    libelle: Alerte sonore
    detail: Avertisseur sonore
    actif: true
    # Un avertisseur continu devient vite insupportable et plus personne
    # n'y reagit : une seconde toutes les huit se remarque sans s'imposer.
    # C'est une propriete du materiel, pas une regle de la serre -- elle
    # s'applique quelle que soit la regle qui le declenche.
    salve: {actif_s: 1, repos_s: 8}
    reel: {driver: gpio, broche: 24}
    simule: {}

  # ---- pilotables depuis l'interface, pas encore par le modele ----

  # Trois LED distinctes plutot qu'un « bandeau » : elles sont cablees
  # separement, elles se commandent separement, et l'ecran doit montrer
  # laquelle est allumee. Les regrouper aurait cache l'information.
  - id: led_rouge
    libelle: LED rouge
    detail: Témoin d'alerte
    actif: true
    reel: {driver: gpio, broche: 17}
    simule: {}

  - id: led_jaune
    libelle: LED jaune
    detail: Témoin d'attention
    actif: true
    reel: {driver: gpio, broche: 27}
    simule: {}

  - id: led_verte
    libelle: LED verte
    detail: Témoin de bon fonctionnement
    actif: true
    reel: {driver: gpio, broche: 22}
    simule: {}

  - id: ecran
    libelle: Écran
    detail: Afficheur de la serre
    actif: true
    reel: {driver: ecran, adresse: 0x27, port: 1, extenseur: PCF8574}
    simule: {}
