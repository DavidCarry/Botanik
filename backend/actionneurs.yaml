# Registre des actionneurs de Botanik.
#
# Meme principe que capteurs.yaml : source unique de verite. Le service
# actionneurs.py y prend ce qu'il doit piloter, l'API ce qu'elle doit
# exposer, et le dashboard s'y adapte sans qu'on le touche.
#
# Chaque actionneur declare DEUX facons d'etre actionne :
#   reel   : la broche GPIO, quand le relais sera cable
#   simule : rien a piloter, l'ordre est simplement accepte
# La variable d'environnement MODE (faux|reel) choisit laquelle s'applique.
#
# `pilote` dit qui commande : "ia" pour ceux que le modele decide,
# "manuel" pour ceux qui n'obeissent qu'a l'interface. C'est le cerveau
# qui le lit, pour savoir de quoi il a la charge -- ajouter un actionneur
# en "ia" suffit a le lui confier.
#
# Les numeros de broche sont en numerotation BCM.
#
# `actif: false` retire un element de TOUTE la chaine : il ne parait plus
# a l'ecran, le cerveau ne lui envoie plus d'ordre, et le service ne le
# pilote pas. C'est le cas de la pompe et de la ventilation, commandees
# mais pas encore livrees -- les declarer sans les avoir donnerait un
# tableau de bord qui promet des actions impossibles. Les remettre a
# `true` le jour de la livraison suffira.

actionneurs:
  - id: pompe
    libelle: Arrosage
    detail: 20 mL par impulsion
    actif: false
    pilote: ia
    reel: {driver: gpio, broche: 23}
    simule: {}

  - id: ventilation
    libelle: Ventilation
    detail: Assèche l'air ambiant
    actif: false
    pilote: ia
    reel: {driver: gpio, broche: 25}
    simule: {}

  - id: lumiere
    libelle: Éclairage
    detail: LED horticole, budget quotidien
    actif: false
    pilote: ia
    reel: {driver: gpio, broche: 24}
    simule: {}

  - id: bipeur
    libelle: Alerte sonore
    detail: Réserve d'eau à remplir
    actif: true
    pilote: ia
    reel: {driver: gpio, broche: 24}
    simule: {}

  # ---- pilotables depuis l'interface, pas encore par le modele ----

  # Trois LED distinctes plutot qu'un « bandeau » : elles sont cablees
  # separement, elles se commandent separement, et l'ecran doit montrer
  # laquelle est allumee. Les regrouper aurait cache l'information.
  - id: led_rouge
    libelle: LED rouge
    detail: Témoin d'alerte
    actif: false
    pilote: manuel
    # COUPEE PAR PRECAUTION : un telemetre a ultrasons est cable
    # sur les broches 17 et 27 d'apres test_distance1.py, et le 27
    # est sa sortie d'echo. La piloter en sortie ferait s'opposer
    # deux circuits sur le meme fil. A remettre a true des que le
    # cablage sera confirme -- ou a deplacer sur d'autres broches.
    reel: {driver: gpio, broche: 17}
    simule: {}

  - id: led_jaune
    libelle: LED jaune
    detail: Témoin d'attention
    actif: false
    pilote: manuel
    # COUPEE PAR PRECAUTION : un telemetre a ultrasons est cable
    # sur les broches 17 et 27 d'apres test_distance1.py, et le 27
    # est sa sortie d'echo. La piloter en sortie ferait s'opposer
    # deux circuits sur le meme fil. A remettre a true des que le
    # cablage sera confirme -- ou a deplacer sur d'autres broches.
    reel: {driver: gpio, broche: 27}
    simule: {}

  - id: led_verte
    libelle: LED verte
    detail: Témoin de bon fonctionnement
    actif: true
    pilote: manuel
    reel: {driver: gpio, broche: 22}
    simule: {}

  - id: ecran
    libelle: Écran
    detail: Afficheur de la serre
    actif: true
    pilote: manuel
    reel: {driver: ecran, adresse: 0x27, port: 1, extenseur: PCF8574}
    simule: {}
