# Broker MQTT de Botanik

listener 1883
protocol mqtt

# Authentification obligatoire. Sans elle, n'importe qui sur le reseau
# pouvait publier sur botanik/commandes/<actionneur> -- donc demarrer la
# pompe -- ou injecter de fausses mesures que le collecteur aurait
# archivees sans broncher.
#
# Le fichier de mots de passe est cree par infra/initialiser-secrets.sh
# et ne figure pas dans le depot.
allow_anonymous false
password_file /mosquitto/config/passwd

# Les messages retenus survivent au redemarrage du conteneur
persistence true
persistence_location /mosquitto/data/

log_dest stdout
